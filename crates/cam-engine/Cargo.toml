[package]
name = "cam-engine"
version = "0.1.0"
edition = "2021"
description = "desktopCAM – CAM-beräkningar (profilering, laserdithering, G-kod) kompilerade till WebAssembly"
# Egen kod: proprietär, alla rättigheter förbehållna (inte öppen källkod).
license = "LicenseRef-desktopCAM-Proprietary"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.93"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
