<?xml version="1.0" encoding="UTF-8"?>
<!-- Exempelfil för desktopCAM: skylt 160 × 90 mm med rundade hörn, hål och dekor. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:xlink="http://www.w3.org/1999/xlink" width="160mm" height="90mm" viewBox="0 0 160 90">
  <defs>
    <circle id="hal" r="2.5"/>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Ytterkontur">
    <rect x="2" y="2" width="156" height="86" rx="8"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Hål">
    <use xlink:href="#hal" x="12" y="12"/>
    <use xlink:href="#hal" x="148" y="12"/>
    <use xlink:href="#hal" x="12" y="78"/>
    <use xlink:href="#hal" x="148" y="78"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Dekor" transform="translate(80 45)">
    <path d="M-30 0a30 18 0 1 0 60 0a30 18 0 1 0-60 0z"/>
    <path d="M-20 0 Q0 -14 20 0 T 60 0" transform="translate(-20 0) scale(0.5)"/>
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3"/>
    <line x1="-40" y1="20" x2="40" y2="20"/>
    <text x="0" y="30">desktopCAM</text>
  </g>
</svg>
